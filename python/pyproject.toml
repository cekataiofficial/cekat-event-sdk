[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "cekat-event-sdk"
version = "0.2.0"
description = "Submit identity-bearing Cekat events from Python backends with browser visitor correlation."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Cekat" }]
keywords = ["cekat", "events", "tracking", "django", "flask", "fastapi", "asgi"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: Django",
  "Framework :: FastAPI",
  "Framework :: Flask",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = ["anyio>=4.5,<5", "httpx>=0.27,<1"]

[project.optional-dependencies]
django = ["Django>=5.2,<7"]
flask = ["Flask>=3.1,<4"]
asgi = ["starlette>=0.41,<2"]
fastapi = ["fastapi>=0.115.3,<1"]
test = [
  "build>=1.2,<2",
  "jsonschema>=4.23,<5",
  "mypy>=1.13,<3",
  "pip-audit>=2.7,<3",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.8,<1",
  "twine>=6,<8",
]

[project.urls]
Source = "https://github.com/cekataiofficial/cekat-event-sdk/tree/main/python"

[tool.hatch.build.targets.wheel]
packages = ["src/cekat_event_sdk"]

[tool.hatch.build.targets.sdist]
include = ["src/cekat_event_sdk", "README.md", "LICENSE", "docs/compatibility.md"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests/unit", "tests/integrations", "tests/packaging"]
addopts = "-ra --strict-markers"
filterwarnings = ["error"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["django.*", "jsonschema.*", "referencing.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py310"
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "BLE", "RUF", "SIM", "PT"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S603"]
