name: Release Ruby gem

# Publishes the cekat-event-sdk gem to RubyGems when a ruby/vX.Y.Z tag is pushed. The gem is built and
# verified by scripts/package-readiness.sh in the build job, and the separate publish job pushes exactly
# that gem file, exchanging the job's OIDC token for short-lived RubyGems credentials through trusted
# publishing, so no API key is stored. The publish job waits for approval through the "rubygems"
# environment.
on:
  push:
    tags:
      - 'ruby/v*'

permissions:
  contents: read

concurrency:
  group: release-ruby-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify the gem
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      RAILS_VERSION: '~> 8.1.0'
      RACK_VERSION: '~> 3.2.0'
      JSON_VERSION: '>= 2.7'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Tag matches the gem version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#ruby/v}"
          declared="$(sed -n 's/.*VERSION *= *"\([^"]*\)".*/\1/p' ruby/lib/cekat_event_sdk/version.rb)"
          if [ "$version" != "$declared" ]; then
            echo "::error::tag $TAG does not match ruby/lib/cekat_event_sdk/version.rb version $declared"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          working-directory: ruby
          bundler-cache: false
      - name: Build and validate the gem
        run: scripts/package-readiness.sh --language ruby --output "$RUNNER_TEMP/cekat-artifacts"
      - uses: actions/upload-artifact@v7
        with:
          name: gem-package
          path: ${{ runner.temp }}/cekat-artifacts/ruby
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish to RubyGems
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: rubygems
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: |
            ci
            scripts
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          rubygems: latest
          bundler-cache: false
      - uses: actions/download-artifact@v8
        with:
          name: gem-package
          path: ${{ runner.temp }}/gem-package
      - name: Verify the downloaded gem
        id: gem
        run: |
          ARTIFACTS="$RUNNER_TEMP/gem-package"
          python3 scripts/validate-package-manifest.py "$ARTIFACTS/manifest.json" --language ruby --version "$VERSION"
          gem_file="$ARTIFACTS/cekat-event-sdk-$VERSION.gem"
          packed="$(ruby -rrubygems/package -e 'spec = Gem::Package.new(ARGV[0]).spec; puts "#{spec.name} #{spec.version}"' "$gem_file")"
          if [ "$packed" != "cekat-event-sdk $VERSION" ]; then
            echo "::error::the gem contains $packed, expected cekat-event-sdk $VERSION"
            exit 1
          fi
          if curl -sfL -o /dev/null "https://rubygems.org/api/v2/rubygems/cekat-event-sdk/versions/$VERSION.json"; then
            echo "::error::cekat-event-sdk $VERSION already exists on RubyGems"
            exit 1
          fi
          echo "gem=$gem_file" >> "$GITHUB_OUTPUT"
      # Exchanges the job's OIDC token for short-lived credentials that only this gem's trusted publisher
      # configuration allows.
      - uses: rubygems/configure-rubygems-credentials@v2.1.0
      - name: Push the verified gem
        env:
          GEM: ${{ steps.gem.outputs.gem }}
        run: |
          gem push "$GEM"
          {
            echo "### Published cekat-event-sdk $VERSION"
            echo ""
            echo "https://rubygems.org/gems/cekat-event-sdk/versions/$VERSION"
          } >> "$GITHUB_STEP_SUMMARY"
