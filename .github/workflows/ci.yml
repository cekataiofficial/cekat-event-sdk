name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Conformance contract and mock server
    runs-on: platform-ci-aws
    timeout-minutes: 15
    defaults:
      run:
        working-directory: conformance/mock-ingest-server
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: conformance/mock-ingest-server/go.mod
          cache-dependency-path: conformance/mock-ingest-server/go.sum
      - name: Vet
        run: go vet ./...
      - name: Test schemas, fixtures, and mock server
        run: go test -count=1 ./...

  go:
    name: Go ${{ matrix.profile }} (${{ matrix.go-version }})
    runs-on: platform-ci-aws
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # The core module's floor. Framework adapters require Go 1.25+ and run in "current".
          - profile: minimum
            go-version: '1.22.12'
            modules: . internal/conformance
          - profile: current
            go-version: stable
            modules: . middleware/gin middleware/echo middleware/fiber middleware/chi internal/conformance
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - &build-mock-setup
        name: Set up Go for the mock ingest server
        uses: actions/setup-go@v7
        with:
          go-version-file: conformance/mock-ingest-server/go.mod
          cache-dependency-path: conformance/mock-ingest-server/go.sum
      - &build-mock
        name: Build mock ingest server
        working-directory: ${{ github.workspace }}
        run: |
          (cd conformance/mock-ingest-server && go build -o "$RUNNER_TEMP/mock-ingest-server" ./cmd/mock-ingest-server)
          echo "MOCK_INGEST_SERVER_BIN=$RUNNER_TEMP/mock-ingest-server" >> "$GITHUB_ENV"
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
          cache-dependency-path: go/**/go.sum
      - name: Vet and test modules
        working-directory: go
        env:
          GOTOOLCHAIN: local
        run: |
          for module in ${{ matrix.modules }}; do
            echo "::group::$module"
            (cd "$module" && go vet ./... && go test -race -count=1 ./...)
            echo "::endgroup::"
          done
      - name: Check formatting
        if: matrix.profile == 'current'
        working-directory: go
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Shared conformance
        env:
          GOTOOLCHAIN: local
        run: scripts/conformance.sh --language go

  node:
    name: Node.js ${{ matrix.profile }} (${{ matrix.node-version }})
    runs-on: platform-ci-aws
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: minimum
            node-version: '22.12.0'
          - profile: current
            node-version: '24'
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - *build-mock-setup
      - *build-mock
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: node/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run check:exports
      - name: Unit, integration, compatibility, and package tests
        env:
          # Skips the test that recursively runs the full release script.
          CEKAT_PACKAGE_VALIDATION: '1'
        run: npm test
      - name: Install Playwright browsers
        if: matrix.profile == 'current'
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Browser tests
        if: matrix.profile == 'current'
        env:
          CI: 'true'
        run: npm run test:browser
      - name: Shared conformance
        working-directory: .
        run: scripts/conformance.sh --language node

  bun:
    name: Bun ${{ matrix.bun-version }} (Node SDK)
    runs-on: platform-ci-aws
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The declared engines.bun floor and the latest observed release. Bun 1.3 fails conformance.
        bun-version: ['1.4.0', '1.4.2']
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - *build-mock-setup
      - *build-mock
      # Node.js and npm install dependencies and run TypeScript; Bun executes the SDK and tests.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: node/package-lock.json
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun-version }}
      - run: bun --version
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Test suites on Bun (including Bun.serve, Hono, and Elysia)
        run: npm run test:bun
      - name: Shared conformance on Bun
        working-directory: .
        env:
          CEKAT_NODE_RUNTIME: bun
        run: scripts/conformance.sh --language node

  python:
    name: Python ${{ matrix.python-version }} (${{ matrix.dependencies }})
    runs-on: platform-ci-aws
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: '3.10'
            dependencies: lowest
          # Also runs Ruff, mypy, pip-audit, build, and twine check through scripts/package.
          - python-version: '3.14'
            dependencies: highest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - *build-mock-setup
      - *build-mock
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - name: Install package and test dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          if [ "${{ matrix.dependencies }}" = lowest ]; then
            .venv/bin/python -m pip install -c constraints-lowest.txt -e ".[test,django,flask,asgi,fastapi]"
          else
            .venv/bin/python -m pip install -e ".[test,django,flask,asgi,fastapi]"
          fi
          .venv/bin/python -m pip list
      - name: Unit, integration, and packaging tests
        if: matrix.dependencies == 'lowest'
        run: .venv/bin/python -m pytest
      - name: Tests, static analysis, security audit, and package build
        if: matrix.dependencies == 'highest'
        run: .venv/bin/python scripts/package --version 0.1.0 --output "$RUNNER_TEMP/python-package"
      - name: Shared conformance
        working-directory: .
        run: scripts/conformance.sh --language python

  dotnet:
    name: .NET ${{ matrix.sdk }} (${{ matrix.test-framework }})
    runs-on: platform-ci-aws
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - sdk: '8.0'
            test-framework: net8.0
          # Also runs the vulnerability audit and packs the NuGet packages through scripts/package.
          - sdk: '10.0'
            test-framework: net10.0
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      TEST_TARGET_FRAMEWORK: ${{ matrix.test-framework }}
    defaults:
      run:
        working-directory: dotnet
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - *build-mock-setup
      - *build-mock
      - uses: actions/setup-dotnet@v6
        env:
          # The default /usr/share/dotnet is not writable by the self-hosted runner user.
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
        with:
          dotnet-version: ${{ matrix.sdk }}.x
      - name: Select the ${{ matrix.sdk }} SDK
        # The runner image may preinstall newer SDKs, which dotnet would otherwise prefer.
        run: |
          version="$(dotnet --list-sdks | awk '/^${{ matrix.sdk }}\./ {v=$1} END {print v}')"
          jq --arg version "$version" '.sdk = {version: $version, rollForward: "latestPatch"}' global.json > global.json.tmp
          mv global.json.tmp global.json
          dotnet --version
      - name: Build and test
        if: matrix.sdk == '8.0'
        run: dotnet test Cekat.EventSdk.sln --configuration Release -p:TestTargetFramework=${{ matrix.test-framework }}
      - name: Build, test, audit, and pack
        if: matrix.sdk == '10.0'
        run: scripts/package --version 0.1.0 --output "$RUNNER_TEMP/dotnet-package"
      - name: Shared conformance
        working-directory: .
        run: scripts/conformance.sh --language dotnet

  php:
    name: PHP ${{ matrix.php-version }} (${{ matrix.dependencies }})
    runs-on: platform-ci-aws
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - php-version: '8.2'
            dependencies: lowest
          - php-version: '8.5'
            dependencies: highest
          # Declared floors not reachable while Laravel is installed: Symfony 6.4 and lowest PSR packages.
          - php-version: '8.2'
            dependencies: symfony-6.4-floor
    env:
      # The self-hosted runner's route to packagist.org can stall; avoid IPv6 and retry network calls.
      COMPOSER_IPRESOLVE: '4'
    defaults:
      run:
        working-directory: php
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - *build-mock-setup
      - *build-mock
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: curl, json, mbstring, zip
          coverage: none
          tools: composer:v2
      - name: Resolve dependencies
        run: |
          retry() {
            for attempt in 1 2 3; do
              "$@" && return 0
              echo "::warning::attempt $attempt of 3 failed: $*"
              sleep $((attempt * 10))
            done
            return 1
          }
          case "${{ matrix.dependencies }}" in
            lowest)
              retry composer update --prefer-lowest --prefer-stable --no-interaction --no-progress ;;
            highest)
              retry composer update --no-interaction --no-progress ;;
            symfony-6.4-floor)
              composer remove --dev --no-update laravel/framework orchestra/testbench
              composer require --dev --no-update "symfony/http-kernel:~6.4.0" "symfony/http-foundation:~6.4.0"
              rm tests/Integration/LaravelIntegrationTest.php
              retry composer update --prefer-lowest --prefer-stable --no-interaction --no-progress ;;
          esac
          composer show --direct
      - name: Validate manifest
        if: matrix.dependencies == 'highest'
        run: composer validate --strict
      - name: Unit, transport, and integration tests
        run: vendor/bin/phpunit --testsuite unit
      - name: Static analysis
        if: matrix.dependencies == 'highest'
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress
      - name: Code style
        if: matrix.dependencies == 'highest'
        run: vendor/bin/php-cs-fixer fix --dry-run --diff
      - name: Security audit
        if: matrix.dependencies == 'highest'
        run: |
          for attempt in 1 2 3; do
            composer audit && exit 0
            echo "::warning::attempt $attempt of 3 failed: composer audit"
            sleep $((attempt * 10))
          done
          exit 1
      - name: Shared conformance
        working-directory: .
        run: scripts/conformance.sh --language php

  ruby:
    name: Ruby ${{ matrix.ruby-version }} (Rails ${{ matrix.rails }}, Rack ${{ matrix.rack }})
    runs-on: platform-ci-aws
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - ruby-version: '3.3'
            rails: '8.0'
            rack: '2.2'
            # Rails 8.0 JSON rendering is incompatible with json 3.x.
            json: '~> 2.7'
          - ruby-version: '3.4'
            rails: '8.1'
            rack: '3.1'
            json: '>= 2.7'
          - ruby-version: '4.0'
            rails: '8.1'
            rack: '3.2'
            json: '>= 2.7'
    env:
      RAILS_VERSION: '~> ${{ matrix.rails }}.0'
      RACK_VERSION: '~> ${{ matrix.rack }}.0'
      JSON_VERSION: ${{ matrix.json }}
    defaults:
      run:
        working-directory: ruby
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - *build-mock-setup
      - *build-mock
      # Prebuilt Rubies only run from /opt/hostedtoolcache, which the self-hosted runner user cannot create.
      - name: Make the Ruby tool cache writable
        run: |
          if [ ! -w /opt/hostedtoolcache ]; then
            sudo -n mkdir -p /opt/hostedtoolcache
            sudo -n chown "$(id -u):$(id -g)" /opt/hostedtoolcache
          fi
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          working-directory: ruby
          bundler-cache: false
      - name: Install gems
        run: bundle install
      - name: Specs (core, Rack, transport, Rails)
        run: bundle exec rake spec
      - name: RuboCop
        run: bundle exec rubocop
      - name: Security audit
        if: matrix.ruby-version == '4.0'
        run: bundle exec bundle-audit check --update
      - name: Shared conformance
        working-directory: .
        run: scripts/conformance.sh --language ruby

  java:
    name: Java ${{ matrix.java-version }} (Spring Boot ${{ matrix.spring-boot }})
    runs-on: platform-ci-aws
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - java-version: '17'
            spring-boot: '4.0.8'
          # JDK 21+ also runs Checkstyle and SpotBugs through the static-analysis profile.
          - java-version: '25'
            spring-boot: '4.1.1'
    defaults:
      run:
        working-directory: java
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - *build-mock-setup
      - *build-mock
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
          cache: maven
          cache-dependency-path: java/**/pom.xml
      - name: Build, test, and analyze
        run: ./mvnw -B -ntp verify -Dspring-boot.version=${{ matrix.spring-boot }}
      - name: Shared conformance
        working-directory: .
        run: scripts/conformance.sh --language java

  required:
    name: CI required
    if: always()
    needs: [contract, go, node, bun, python, php, ruby, java, dotnet]
    runs-on: platform-ci-aws
    steps:
      - name: Require every job to succeed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || exit 1
          done
