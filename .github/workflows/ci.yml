name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Conformance contract and mock server
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: conformance/mock-ingest-server
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: conformance/mock-ingest-server/go.mod
          cache-dependency-path: conformance/mock-ingest-server/go.sum
      - name: Vet
        run: go vet ./...
      - name: Test schemas, fixtures, and mock server
        run: go test -count=1 ./...

  go:
    name: Go ${{ matrix.profile }} (${{ matrix.go-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # The core module's floor. Framework adapters require Go 1.25+ and run in "current".
          - profile: minimum
            go-version: '1.22.12'
            modules: . internal/conformance
          - profile: current
            go-version: stable
            modules: . middleware/gin middleware/echo middleware/fiber middleware/chi internal/conformance
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - &build-mock-setup
        name: Set up Go for the mock ingest server
        uses: actions/setup-go@v7
        with:
          go-version-file: conformance/mock-ingest-server/go.mod
          cache-dependency-path: conformance/mock-ingest-server/go.sum
      - &build-mock
        name: Build mock ingest server
        working-directory: ${{ github.workspace }}
        run: |
          (cd conformance/mock-ingest-server && go build -o "$RUNNER_TEMP/mock-ingest-server" ./cmd/mock-ingest-server)
          echo "MOCK_INGEST_SERVER_BIN=$RUNNER_TEMP/mock-ingest-server" >> "$GITHUB_ENV"
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
          cache-dependency-path: go/**/go.sum
      - name: Vet and test modules
        working-directory: go
        env:
          GOTOOLCHAIN: local
        run: |
          for module in ${{ matrix.modules }}; do
            echo "::group::$module"
            (cd "$module" && go vet ./... && go test -race -count=1 ./...)
            echo "::endgroup::"
          done
      - name: Check formatting
        if: matrix.profile == 'current'
        working-directory: go
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Shared conformance
        env:
          GOTOOLCHAIN: local
        run: scripts/conformance.sh --language go

  node:
    name: Node.js ${{ matrix.profile }} (${{ matrix.node-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: minimum
            node-version: '22.12.0'
          - profile: current
            node-version: '24'
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - *build-mock-setup
      - *build-mock
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: node/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run check:exports
      - name: Unit, integration, compatibility, and package tests
        env:
          # Skips the test that recursively runs the full release script.
          CEKAT_PACKAGE_VALIDATION: '1'
        run: npm test
      - name: Install Playwright browsers
        if: matrix.profile == 'current'
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Browser tests
        if: matrix.profile == 'current'
        env:
          CI: 'true'
        run: npm run test:browser
      - name: Shared conformance
        working-directory: .
        run: scripts/conformance.sh --language node

  php:
    name: PHP ${{ matrix.php-version }} (${{ matrix.dependencies }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - php-version: '8.2'
            dependencies: lowest
          - php-version: '8.5'
            dependencies: highest
          # Declared floors not reachable while Laravel is installed: Symfony 6.4 and lowest PSR packages.
          - php-version: '8.2'
            dependencies: symfony-6.4-floor
    defaults:
      run:
        working-directory: php
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - *build-mock-setup
      - *build-mock
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: curl, json, mbstring, zip
          coverage: none
          tools: composer:v2
      - name: Resolve dependencies
        run: |
          case "${{ matrix.dependencies }}" in
            lowest)
              composer update --prefer-lowest --prefer-stable --no-interaction --no-progress ;;
            highest)
              composer update --no-interaction --no-progress ;;
            symfony-6.4-floor)
              composer remove --dev --no-update laravel/framework orchestra/testbench
              composer require --dev --no-update "symfony/http-kernel:~6.4.0" "symfony/http-foundation:~6.4.0"
              rm tests/Integration/LaravelIntegrationTest.php
              composer update --prefer-lowest --prefer-stable --no-interaction --no-progress ;;
          esac
          composer show --direct
      - name: Validate manifest
        if: matrix.dependencies == 'highest'
        run: composer validate --strict
      - name: Unit, transport, and integration tests
        run: vendor/bin/phpunit --testsuite unit
      - name: Static analysis
        if: matrix.dependencies == 'highest'
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress
      - name: Code style
        if: matrix.dependencies == 'highest'
        run: vendor/bin/php-cs-fixer fix --dry-run --diff
      - name: Security audit
        if: matrix.dependencies == 'highest'
        run: composer audit
      - name: Shared conformance
        working-directory: .
        run: scripts/conformance.sh --language php

  required:
    name: CI required
    if: always()
    needs: [contract, go, node, php]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every job to succeed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || exit 1
          done
